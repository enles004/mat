[project]
name = "mat-ai"
version = "0.1.0"
description = "Vietnamese automotive sentiment training and inference service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyvi>=0.1.1",
  "pyyaml>=6,<7",
  "result>=0.17.0",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
transformer = [
  "accelerate>=1.4,<2",
  "datasets>=3.3,<5",
  "huggingface-hub>=0.29,<2",
  "safetensors>=0.5,<1",
  "torch>=2.6,<3",
  "transformers>=4.49,<=5.5.0",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0,<7",
]

# torch resolves to the CPU wheel (see ai/Dockerfile.gpu for the CUDA path).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
mat-validate-data = "scripts.data_validate:main"
mat-split-data = "scripts.data_split:main"
mat-train-baseline = "scripts.train_baseline:main"
mat-evaluate = "scripts.eval_predictions:main"
mat-demo-vietnamese = "scripts.demo_api_vietnamese:main"
mat-serve = "main:run"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"config.py" = "config.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "performance: reference-runner budget measurements excluded from the fast profile",
  "release: Docker/packaging runtime gates run serially before a release",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is declared in parameter defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "main.py", "config.py"]
